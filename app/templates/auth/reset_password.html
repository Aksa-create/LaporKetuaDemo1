{% extends 'base.html' %}

{% block title %}Atur Ulang Password{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">

        <span class="eyebrow">PEMULIHAN AKUN</span>

        <h1>Buat Password Baru</h1>

        <p class="muted">
            Masukkan password baru untuk akun LaporKetua kamu.
        </p>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="form-label">Password Baru</label>

            <input type="password" class="form-control mb-3" name="password" minlength="10" required
                autocomplete="new-password">

            <label class="form-label">Konfirmasi Password</label>

            <input type="password" class="form-control mb-3" name="confirm_password" minlength="10" required
                autocomplete="new-password">

            <button type="submit" class="btn btn-teal w-100">
                Simpan Password Baru
            </button>
        </form>

    </div>
</div>
{% endblock %}

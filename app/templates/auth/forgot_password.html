{% extends 'base.html' %}

{% block title %}Lupa Password{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">

        <span class="eyebrow">PEMULIHAN AKUN</span>

        <h1>Lupa Password?</h1>

        <p class="muted">
            Masukkan email yang terhubung dengan akun LaporKetua.
            Kami akan mengirimkan link untuk mengatur ulang password.
        </p>

        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="form-label">Alamat Email</label>

            <input type="email" class="form-control mb-3" name="email" placeholder="nama@email.com" required
                autocomplete="email">

            <button type="submit" class="btn btn-teal w-100">
                Kirim Link Reset Password
            </button>
        </form>

        <p class="mt-3 mb-0 text-center">
            <a href="{{ url_for('auth.login') }}">
                Kembali ke halaman masuk
            </a>
        </p>

    </div>
</div>
{% endblock %}

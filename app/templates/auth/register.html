{% extends 'base.html' %}{% block title %}Daftar{% endblock %}{% block content %}<div class="auth-wrap">
    <div class="auth-card"><span class="eyebrow">GABUNG BERSAMA WARGA</span>
        <h1>Buat Akun</h1>
        <p class="muted">Daftarkan akun untuk mulai menyampaikan laporan.</p>
        <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label
                class="form-label">Nama lengkap</label><input class="form-control mb-3" name="full_name" maxlength="120"
                required><label class="form-label">Username</label><input class="form-control mb-3" name="username"
                minlength="3" maxlength="40" required><label class="form-label">Email</label><input
                class="form-control mb-3" type="email" name="email" required><label class="form-label">RT</label><select
                class="form-select mb-3" name="rt_number" required>
                <option value="">Pilih RT</option>{% for rt in rts %}<option value="{{ rt.number }}">RT {{ rt.number }}
                </option>{% endfor %}
            </select>
            <label class="form-label">Daftar Sebagai</label>
            <select class="form-select mb-3" name="role" required>
                <option value="warga" selected>Warga</option>
                <option value="petugas">Petugas Lapangan</option>
            </select>
            <label class="form-label">Password (minimal 10 karakter)</label><input class="form-control mb-3"
                type="password" name="password" minlength="10" required><label class="form-label">Konfirmasi
                password</label><input class="form-control mb-3" type="password" name="confirm_password" minlength="10"
                required><button class="btn btn-teal w-100">Buat akun</button>
        </form>
        <p class="mt-3 mb-0 text-center">Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a></p>
    </div>
</div>{% endblock %}
